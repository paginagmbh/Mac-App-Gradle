buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '1.2.1'

    id 'gmbh.pagina.tools.gradle.release' version '1.2.0'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()

    testImplementation gradleTestKit()
    testImplementation 'garden.ephemeral.dsstore:macfiles:0.0.9'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
}

test {
    useJUnitPlatform()
}

tasks.register('createTestDmg', Test) {
    description = 'Creates an unsigned sample DMG in build/dmg-test for manual inspection (macOS only).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'gmbh.pagina.tools.gradle.mac_app.SignAndNotarizeTest.createDmg_includesBackgroundAndUnmodifiedApp'
    }
    def destination = layout.buildDirectory.dir('dmg-test')
    outputs.dir(destination)
    outputs.upToDateWhen { false }
    doFirst {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
            throw new GradleException('createTestDmg requires macOS and hdiutil.')
        }
        systemProperty 'macApp.testDmgDirectory', destination.get().asFile.absolutePath
    }
}

group = "gmbh.pagina.tools.gradle"
version = "2.0.8-SNAPSHOT"

javadoc {
    options.encoding = 'UTF-8'
}

compileJava {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

gradlePlugin {
    website = 'https://github.com/paginagmbh/Mac-App-Gradle'
    vcsUrl = 'https://github.com/paginagmbh/Mac-App-Gradle'

    plugins {
        myPlugins {
            id = "${project.group}.mac_app"
            implementationClass = "${project.group}.mac_app.GenerateMacAppPlugin"
            displayName = 'Mac App Bundler and Signer'
            description = 'Create a Mac App for java source, sign and notarize it.'
            tags.set(['macOS', 'mac', 'codesign', 'sign', 'notarize', 'bundle'])
        }
    }
}

def artifactory_url = "https://bintray.pagina.gmbh/artifactory"
publishing {
    repositories {
        maven {
            url = version.endsWith('SNAPSHOT') ? "${artifactory_url}/plugins-snapshot-local" : "${artifactory_url}/plugins-release-local"
            name = version.endsWith('SNAPSHOT') ? "PaginaArtifactoryLocalPluginsSnapshots" : "PaginaArtifactoryLocalPluginsReleased"
            credentials {
                username = System.getenv("ARTIFACTORY_USER")
                password = System.getenv("ARTIFACTORY_PASSWORD")
            }
        }
    }
}


updateVersionNumberInReadme {
    pluginId = "${project.group}.mac_app"
}
